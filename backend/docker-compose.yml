version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: subhancare-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: subhancare123
      MONGO_INITDB_DATABASE: subhancare
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - subhancare-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subhancare-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://admin:subhancare123@mongodb:27017/subhancare?authSource=admin
      JWT_SECRET: subhancare_jwt_secret_key_2026
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - subhancare-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: subhancare-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - subhancare-network

volumes:
  mongodb_data:
    driver: local

networks:
  subhancare-network:
    driver: bridge